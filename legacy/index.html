<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Резонанс Двора — Большой район</title><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="legacy.css?v=23a2868c2582"><script>window.onerror=function(message){var e=document.getElementById('startup');if(e){e.style.display='block';e.innerHTML='Не удалось запустить игру: '+String(message).replace(/[<>]/g,'');}return false;};</script></head>
<body>
<div id="startup">Открывается Резонанс Двора…</div>
<div id="board-tools"><strong>РЕЗОНАНС ДВОРА</strong><button id="ui-coop">Вдвоём</button><button id="ui-fullscreen">Полный экран</button><button id="ui-help">?</button></div>
<canvas id="interface" width="1280" height="720" aria-label="Меню Резонанс Двора"></canvas>
<div id="menu" style="display:none"><select id="count"><option value="1">Один</option><option value="2">Двое</option></select><select id="mode"><option value="arena">Арена</option></select><select id="map"></select><select id="hero1"></select><span id="second-choice"><select id="hero2"></select></span><select id="boss"></select><p id="mode-description"></p><p id="menu-error"></p><p id="record"></p><button id="play"></button><button id="menu-fullscreen"></button><button id="sound"></button></div>
<canvas id="game" width="1280" height="720"></canvas>
<div id="dock" class="solo">
<div id="panel1" class="player-panel"><div id="status1" class="player-status">ИГРОК 1</div><div class="player-body"><div id="stick1" class="stick"><div class="knob"></div><span>ДВИЖЕНИЕ</span></div><div class="actions"><button id="skill1">Приём</button><button id="ult1">Ульта</button><button id="dash1">Рывок</button><button id="reload1">Перезарядка</button></div></div></div>
<div id="panel2" class="player-panel"><div id="status2" class="player-status">ИГРОК 2</div><div class="player-body"><div id="stick2" class="stick"><div class="knob"></div><span>ДВИЖЕНИЕ</span></div><div class="actions"><button id="skill2">Приём</button><button id="ult2">Ульта</button><button id="dash2">Рывок</button><button id="reload2">Перезарядка</button></div></div></div>
<div id="team-switch"><button id="team0"></button><button id="team1"></button><button id="team2"></button></div><div id="training-switch"><button id="training-prev">← Герой</button><button id="training-next">Герой →</button></div><div class="dock-tools"><button id="pause">Пауза</button><button id="fullscreen">Полный экран</button><button id="leave">В меню</button></div></div>
<div id="overlay" class="screen"><div class="modal-card"><h2 id="overlay-title"></h2><p id="overlay-text"></p><div id="overlay-buttons"></div></div></div>
<input id="import-save" type="file" accept="application/json,.json" style="display:none">
<div id="cinema"><video id="edit-video" src="../media/edit3000.mp4" controls playsinline preload="none"></video><button id="video-close">Вернуться в игру</button></div>
<script src="data.js?v=90efd17b6667"></script><script src="profile.js?v=34d6279c6700"></script><script src="legacy.js?v=a409182c2b29"></script><script src="shell.js?v=c9a93721d4a7"></script>
</body></html>
